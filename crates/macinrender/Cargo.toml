[package]
name = "macindecode-macinrender"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false
links = "macinrender"

[dependencies]
serde_json = "1"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
# ADM Core is a Rust library since its 6.6 build migration: `mradm-capi` implements
# the C ABI, and its `mradm-islands-sys` dependency builds the C/C++ islands and
# codecs through CMake. Linking the rlib keeps one std under ThinLTO. Keep the
# revision aligned with the workspace `[patch.crates-io]`.
mradm-capi = { git = "https://github.com/SakuzyPeng/MacinRender-ADM-Core.git", rev = "c87e18b5383607bac778af2d92bbb0585b252741" }
# Named directly only for its `links` metadata: the islands' link manifest.
mradm-islands-sys = { git = "https://github.com/SakuzyPeng/MacinRender-ADM-Core.git", rev = "c87e18b5383607bac778af2d92bbb0585b252741" }

[build-dependencies]
cc = "1"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
